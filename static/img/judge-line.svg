<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260">
  <rect width="800" height="260" fill="#08080a"/>
  <g stroke="#1b1b20" stroke-width="1">
    <path d="M0 60H800M0 130H800M0 200H800"/>
    <path d="M100 0V260M300 0V260M500 0V260M700 0V260"/>
  </g>
  <!-- 判定线 -->
  <line x1="60" y1="130" x2="740" y2="130" stroke="#ffffff" stroke-width="2"/>
  <line x1="60" y1="130" x2="330" y2="130" stroke="#ffffff" stroke-width="2" opacity="0.9"/>
  <!-- 竖杆 -->
  <line x1="240" y1="104" x2="240" y2="156" stroke="#ffffff" stroke-width="2"/>
  <!-- 移动的 note -->
  <rect x="430" y="123" width="14" height="14" fill="#35e0ff" transform="rotate(45 437 130)"/>
  <rect x="430" y="123" width="14" height="14" fill="#35e0ff" opacity="0.35" transform="rotate(45 437 130) scale(1.8)" style="transform-origin:437px 130px"/>
  <!-- 刻度 -->
  <line x1="560" y1="130" x2="560" y2="139" stroke="#ffffff" stroke-width="1" opacity="0.35"/>
  <line x1="660" y1="130" x2="660" y2="139" stroke="#ffffff" stroke-width="1" opacity="0.35"/>
  <!-- 标注 -->
  <g font-family="monospace" font-size="11" fill="#74747f" letter-spacing="2">
    <text x="60" y="112">JUDGE LINE</text>
    <text x="228" y="96">BAR</text>
    <text x="418" y="104">NOTE</text>
    <text x="548" y="158">TICK</text>
  </g>
  <text x="60" y="230" font-family="monospace" font-size="10" fill="#4a4a53" letter-spacing="3">2PX LINE / 11PX DIAMOND / 0.22EM TRACKING</text>
</svg>
