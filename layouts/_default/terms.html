{{ define "main" }}
<header class="page-head">
  <div class="page-kicker"><span class="diamond diamond-sm" aria-hidden="true"></span><span>TAXONOMY</span></div>
  <h1 class="page-title glitch" data-text="{{ .Title }}">{{ .Title }}</h1>
  <div class="judge-line judge-line-thin" aria-hidden="true"><span class="judge-bar"></span></div>
</header>

<div class="tags-grid">
  {{ range .Data.Terms.Alphabetical }}
    <a class="tag-card" href="{{ .Page.RelPermalink }}">
      <span class="tag-card-name">{{ .Page.Title }}</span>
      <span class="tag-card-count">{{ printf "%02d" .Count }}</span>
    </a>
  {{ end }}
</div>
{{ end }}
