{{ define "main" }}
<div class="page">
  <header class="sheet-head cue cue-1">
    <div>
      <p class="ef-eyebrow">Tags</p>
      <h1>{{ .Title }}</h1>
    </div>
    <p class="ef-field">{{ len .Data.Terms }} 个</p>
  </header>
  {{ if .Data.Terms }}
  <div class="ef-chips tag-cloud cue cue-2">
    {{- range .Data.Terms.ByCount }}
    <a class="ef-chip" href="{{ .Page.RelPermalink }}">{{ .Page.LinkTitle }}<span>{{ .Count }}</span></a>
    {{- end }}
  </div>
  {{ else }}
  <div class="empty-plate"><p>还没有标签。给文章加上 <code>tags</code> 就会出现在这里。</p></div>
  {{ end }}
</div>
{{ end }}
