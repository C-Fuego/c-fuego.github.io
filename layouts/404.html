{{ define "main" }}
<section class="lost">
  <div class="shape shape-404" aria-hidden="true">
    <span data-shape="concentric" data-shape-opts='{"n":14}'></span>
    <span data-shape="rays" data-shape-opts='{"n":64}'></span>
  </div>
  <span class="ef-hollow-no" aria-hidden="true">404</span>
  <h1>这一页不存在</h1>
  <p>地址可能写错了，或者那篇文章已经不在了。</p>
  <p class="ef-actions">
    <a class="ef-btn go" href="{{ "" | relURL }}">回首页</a>
    <a class="ef-btn" href="{{ "posts/" | relURL }}">看文章</a>
  </p>
</section>
{{ end }}
