{{- $title := printf "%s // %s" .Title site.Title -}}
{{- if .IsHome -}}{{- $title = site.Title -}}{{- end -}}
{{- if eq .Kind "404" -}}{{- $title = printf "页面不存在 // %s" site.Title -}}{{- end -}}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ $title }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
<link rel="canonical" href="{{ .Permalink }}">
<meta property="og:title" content="{{ $title }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site.Title }}">
{{- with .Summary }}<meta property="og:description" content="{{ . | plainify | truncate 140 }}">{{ end }}
<script>
  try {
    var t = localStorage.getItem('theme');
    if (t) document.documentElement.dataset.theme = t;
    var v = localStorage.getItem('variant');
    if (v) document.documentElement.dataset.efVariant = v;
  } catch (e) {}
</script>
<script src="{{ "ef/variant.js" | relURL }}?v={{ now.Unix }}"></script>
<meta name="theme-color" content="#F4F4F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191919" media="(prefers-color-scheme: dark)">
<link rel="icon" href="{{ "favicon.svg" | relURL }}" type="image/svg+xml">
<link rel="alternate" type="application/rss+xml" href="{{ "index.xml" | relURL }}" title="{{ site.Title }}">
<link rel="preload" href="{{ "fonts/saira-var.woff2" | relURL }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ "ef/endfield.css" | relURL }}?v={{ now.Unix }}">
<link rel="stylesheet" href="{{ "css/chroma.css" | relURL }}?v={{ now.Unix }}">
<link rel="stylesheet" href="{{ "css/main.css" | relURL }}?v={{ now.Unix }}">
