<header class="ef-cmdbar site-bar">
  <a class="brand" href="{{ "" | relURL }}"><span class="brand-mark" aria-hidden="true">//</span>{{ site.Title }}</a>
  <nav aria-label="导航">
    {{- range site.Menus.main }}
    <a href="{{ .URL | relURL }}"{{ if or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) }} aria-current="page"{{ end }}>{{ .Name }}</a>
    {{- end }}
  </nav>
  <div class="util">
    <span class="dot" aria-hidden="true"></span>
    <span>SYS.NOMINAL</span>
    <span class="clock" data-clock>--:--:--</span>
  </div>
</header>
