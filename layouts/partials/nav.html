<header class="ef-topbar site-topbar">
  <a class="brand" href="{{ "/" | relURL }}">
    <span class="ef-eyebrow slash">Layer 00</span>
    <strong>{{ site.Title }}</strong>
  </a>
  <nav class="site-nav" aria-label="主导航">
    {{ range site.Menus.main }}
      <a href="{{ .URL | relURL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a>
    {{ end }}
    <button class="nav-search" type="button" data-search-open aria-label="搜索（快捷键 斜杠）">Search</button>
  </nav>
  <button class="ef-btn small" type="button" data-theme-toggle>深浅</button>
</header>
