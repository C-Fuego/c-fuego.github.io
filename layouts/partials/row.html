{{ $p := .p }}
{{ $i := .i }}
<a class="row" href="{{ $p.RelPermalink }}">
  <span class="row-idx">{{ printf "%03d" $i }}</span>
  <span class="row-mark" aria-hidden="true"></span>
  <span class="row-main">
    <span class="row-title">{{ $p.Title }}</span>
    {{ with $p.Params.summary }}<span class="row-desc">{{ . }}</span>{{ else }}{{ with $p.Summary }}<span class="row-desc">{{ . | plainify | truncate 90 }}</span>{{ end }}{{ end }}
  </span>
  <span class="row-tags">
    {{ range $p.Params.tags }}<span class="tag">{{ . }}</span>{{ end }}
  </span>
  <time class="row-date" datetime="{{ $p.Date.Format "2006-01-02" }}">{{ $p.Date.Format "2006.01.02" }}</time>
</a>
