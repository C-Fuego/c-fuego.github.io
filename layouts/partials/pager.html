{{ $p := . }}
{{ if gt $p.TotalPages 1 }}
<nav class="site-pager" aria-label="分页">
  {{ if $p.HasPrev }}<a href="{{ $p.Prev.URL }}">上一页</a>{{ else }}<span class="pager-gap">上一页</span>{{ end }}
  {{ range $p.Pagers }}
    {{ if eq .PageNumber $p.PageNumber }}<span class="is-current">{{ .PageNumber }}</span>{{ else }}<a href="{{ .URL }}">{{ .PageNumber }}</a>{{ end }}
  {{ end }}
  {{ if $p.HasNext }}<a href="{{ $p.Next.URL }}">下一页</a>{{ else }}<span class="pager-gap">下一页</span>{{ end }}
</nav>
{{ end }}
