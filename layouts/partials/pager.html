{{ $p := . }}
{{ if gt $p.TotalPages 1 }}
<nav class="pager" aria-label="分页">
  {{ if $p.HasPrev }}<a href="{{ $p.Prev.URL }}">← PREV</a>{{ else }}<span class="pager-gap">← PREV</span>{{ end }}
  {{ range $p.Pagers }}
    {{ if eq .PageNumber $p.PageNumber }}<span class="is-current">{{ .PageNumber }}</span>{{ else }}<a href="{{ .URL }}">{{ .PageNumber }}</a>{{ end }}
  {{ end }}
  {{ if $p.HasNext }}<a href="{{ $p.Next.URL }}">NEXT →</a>{{ else }}<span class="pager-gap">NEXT →</span>{{ end }}
</nav>
{{ end }}
