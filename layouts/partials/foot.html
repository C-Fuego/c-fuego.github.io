  </div>
  <div class="foot-links">
    <a href="{{ "" | relURL }}">首页</a>
    <a href="{{ "posts/" | relURL }}">文章</a>
    <a href="{{ "tags/" | relURL }}">标签</a>

  </div>
</footer>
