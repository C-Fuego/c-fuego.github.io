<!doctype html>
<html lang="zh-CN" data-ef-accent="yellow" data-ef-paper="neutral" data-ef-cut="standard">
<head>
  {{ partial "head.html" . }}
</head>
<body class="ef ef-contours" data-index="{{ "index.json" | relURL }}">
  <a class="skip" href="#main">跳到正文</a>
  {{ partial "cmdbar.html" . }}
  <main id="main">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "foot.html" . }}
  {{- if and .IsPage (eq .Section "posts") }}
  <div class="read-dial" data-read-dial aria-hidden="true">
    <svg viewBox="0 0 72 72" width="72" height="72">
      <g class="dial-ticks" data-dial-ticks></g>
      <text class="dial-num" data-dial-num x="36" y="36" text-anchor="middle" dominant-baseline="central">0</text>
    </svg>
  </div>
  {{- end }}
  {{ partial "search.html" . }}
  <script src="{{ "js/site.js" | relURL }}?v={{ now.Unix }}" defer></script>
  <script type="module">
    import { wireTheme, wireReadouts } from "{{ "ef/fx.js" | relURL }}?v={{ now.Unix }}";
    wireTheme();
    wireReadouts(document);
  </script>
</body>
</html>
