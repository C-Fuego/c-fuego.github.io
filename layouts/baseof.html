<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} — {{ site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
  <meta name="theme-color" content="#F4F4F1">
  <script>
    try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="icon" href="{{ "favicon.svg" | relURL }}" type="image/svg+xml">
  <link rel="mask-icon" href="{{ "favicon.svg" | relURL }}" color="#FFFA00">
  <link rel="apple-touch-icon" href="{{ "apple-touch-icon.png" | relURL }}">
  <link rel="preload" href="{{ "fonts/noto-sans-sc-subset.woff2" | relURL }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ "fonts/saira-var.woff2" | relURL }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ "ef/endfield.css" | relURL }}?v={{ now.Unix }}">
  <link rel="stylesheet" href="{{ "css/site.css" | relURL }}?v={{ now.Unix }}">
<script>
  (function () {
    try {
      var h = sessionStorage.getItem('hatch-go');
      if (h) {
        sessionStorage.removeItem('hatch-go');
        var el = null;
        document.addEventListener('DOMContentLoaded', function () {
          el = document.querySelector('[data-hatch]');
          if (el) el.classList.add('is-revealing');
        });
      }
    } catch (e) {}
  })();
</script>
</head>
<body class="ef ef-contours">
  <div class="vt-hatch" data-hatch aria-hidden="true"></div>
  <a class="skip" href="#main">跳到正文</a>
  {{ partial "statusbar.html" . }}
  <div class="ef-tri ef-in-sweep" aria-hidden="true"><i></i><i></i><i></i></div>

  <main id="main">
    {{ block "main" . }}{{ end }}
  </main>

  {{ partial "footer.html" . }}

  <script src="{{ "js/status.js" | relURL }}?v={{ now.Unix }}" defer></script>
  <script type="module">
    import { wireTheme, wireReadouts } from "{{ "ef/fx.js" | relURL }}?v={{ now.Unix }}";
    wireTheme();
    wireReadouts(document);
  </script>
</body>
</html>
