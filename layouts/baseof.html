<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}" data-theme="light">
<head>
  {{ partial "head.html" . }}
  <script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body class="ef ef-contours">
  <a class="skip" href="#main">跳到正文</a>
  <div class="ef-tri" aria-hidden="true"><i></i><i></i><i></i></div>
  {{ partial "nav.html" . }}
  <main id="main">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "foot.html" . }}
  {{ partial "search.html" . }}
  <script src="{{ "js/ui.js" | relURL }}?v={{ now.Unix }}" defer></script>
  <script type="module">
    import { wireTheme, wireReadouts, wireParallax } from "{{ "ef/fx.js" | relURL }}?v={{ now.Unix }}";
    wireTheme();
    wireReadouts(document);
    var hero = document.querySelector("[data-hero]");
    if (hero) wireParallax(hero);
  </script>
</body>
</html>
