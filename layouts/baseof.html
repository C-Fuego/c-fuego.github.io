<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} — {{ site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
  <meta name="theme-color" content="#E8E8E2">
  <script>
    try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="preload" href="{{ "fonts/noto-sans-sc-subset.woff2" | relURL }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ "fonts/saira-var.woff2" | relURL }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ "ef/endfield.css" | relURL }}?v={{ now.Unix }}">
  <link rel="stylesheet" href="{{ "css/site.css" | relURL }}?v={{ now.Unix }}">
<script>
  (function () {
    try {
      if (sessionStorage.getItem('vt-go')) {
        sessionStorage.removeItem('vt-go');
        document.documentElement.classList.add('vt-entering');
        setTimeout(function () { document.documentElement.classList.remove('vt-entering'); }, 580);
      }
    } catch (e) {}
  })();
</script>
</head>
<div class="vt" data-vt aria-hidden="true">
    <div class="vt-lead"></div>
    <div class="vt-bars"></div>
    <div class="vt-rows"></div>
    <div class="vt-fill"></div>
  </div>
<body class="ef ef-contours">
  <a class="skip" href="#main">跳到正文</a>
  {{ partial "statusbar.html" . }}
  <div class="ef-tri ef-in-sweep" aria-hidden="true"><i></i><i></i><i></i></div>

  <main id="main">
    {{ block "main" . }}{{ end }}
  </main>

  {{ partial "footer.html" . }}

  <script src="{{ "js/status.js" | relURL }}?v={{ now.Unix }}" defer></script>
  <script type="module">
    import { wireTheme, wireReadouts } from "{{ "ef/fx.js" | relURL }}?v={{ now.Unix }}";
    wireTheme();
    wireReadouts(document);
  </script>
</body>
</html>
