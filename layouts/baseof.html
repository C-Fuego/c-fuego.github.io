<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}" data-world="{{ site.Params.worldName }}">
<head>
  {{ partial "head.html" . }}
</head>
<body class="kind-{{ .Kind }}{{ with .Section }} sec-{{ . }}{{ end }}">
  <a class="skip" href="#main">跳到正文</a>
  <canvas id="bits" aria-hidden="true"></canvas>
  <div class="scanlines" aria-hidden="true"></div>
  {{ if .IsPage }}<div class="read-progress" aria-hidden="true"><span class="read-bar"></span><span class="read-note"></span></div>{{ end }}
  {{ partial "nav.html" . }}
  <main id="main">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "foot.html" . }}

  <button class="to-top" type="button" aria-label="回到顶部"></button>

  <div class="search" data-json="{{ "index.json" | relURL }}" role="dialog" aria-modal="true" aria-label="站内搜索">
    <div class="search-panel">
      <div class="search-head">
        <span class="search-kicker">SEARCH //</span>
        <input class="search-input" type="search" placeholder="关键词…" autocomplete="off" spellcheck="false">
        <button class="search-close" type="button">ESC</button>
      </div>
      <div class="search-hint">输入关键词：标题、摘要、正文都会匹配</div>
      <div class="search-results"></div>
    </div>
  </div>

  <script src="{{ "js/binary.js" | relURL }}?v={{ now.Unix }}" defer></script>
  <script src="{{ "js/ui.js" | relURL }}?v={{ now.Unix }}" defer></script>
</body>
</html>
