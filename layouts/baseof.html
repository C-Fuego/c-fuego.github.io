<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} — {{ site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
  <meta name="theme-color" content="#0B0E0F">
  <link rel="preload" href="{{ "css/tokens.css" | relURL }}" as="style">
  <link rel="stylesheet" href="{{ "css/tokens.css" | relURL }}?v={{ now.Unix }}">
  <link rel="stylesheet" href="{{ "css/global.css" | relURL }}?v={{ now.Unix }}">
</head>
<body>
  <div class="fx-layer" aria-hidden="true">
    <span class="fx-corner tl"></span>
    <span class="fx-corner tr"></span>
    <span class="fx-corner bl"></span>
    <span class="fx-corner br"></span>
  </div>

  {{ partial "statusbar.html" . }}

  <main>
    {{ block "main" . }}{{ end }}
  </main>

  {{ partial "footer.html" . }}

  <script src="{{ "js/status.js" | relURL }}?v={{ now.Unix }}" defer></script>
</body>
</html>
