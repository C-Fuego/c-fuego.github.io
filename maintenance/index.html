<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<title>1GN4CI0 · 维护中</title>
<style>
  /* 维护时 public/ 被整体替换，站点字体不在，所以这份子集跟页面放在一起 */
  @font-face {
    font-family: "Maintenance Sans";
    src: url("./fonts/noto.woff2") format("woff2");
    font-weight: 100 900;
    font-display: swap;
  }
  /* 拉丁字标用 Saira 宽体，和 skill 的 .ef-wordmark 一致 */
  @font-face {
    font-family: "Maintenance Wide";
    src: url("./fonts/saira.woff2") format("woff2");
    font-weight: 100 900;
    font-stretch: 50% 125%;
    font-display: swap;
  }
  @font-face {
    font-family: "Maintenance Mono";
    src: url("./fonts/mono.woff2") format("woff2");
    font-weight: 400;
    font-display: swap;
  }

  :root {
    --paper: #F4F4F1;
    --ink: #161616;
    --ink-2: #5C5C58;
    --rule: #DCDCD7;
    --signal: #FFFA00;
    --magenta: #FF00F0;
    --mint: #00F0B4;
    --sans: "Maintenance Sans", -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    --mono: "Maintenance Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    grid-template-rows: 3px 1fr 3px;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  .tri { display: grid; grid-template-columns: repeat(3, 1fr); }
  .tri i:nth-child(1) { background: var(--magenta); }
  .tri i:nth-child(2) { background: var(--signal); }
  .tri i:nth-child(3) { background: var(--mint); }

  /* 等高线底纹：和站点同一套质感，纯 CSS */
  main {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: clamp(1.5rem, 6vw, 6rem);
    overflow: hidden;
  }
  /* 等高线地形：右上角为圆心向外扩散，靠 mask 渐隐、内实外虚、斜线阴影只在内圈 */
  .terrain {
    position: absolute;
    top: 0;
    right: 0;
    width: min(80vmin, 760px);
    height: auto;
    color: var(--ink);
    pointer-events: none;
    opacity: 0.95;
  }

  .eyebrow {
    position: relative;
    margin: 0 0 clamp(1.25rem, 3.5vh, 2.25rem);
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-2);
  }
  .eyebrow::before { content: "// "; opacity: 0.55; }

  h1 {
    position: relative;
    margin: 0;
    font-size: clamp(3rem, 10vw, 11rem);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.02em;
  }

  /* 伪 3D：两层硬边投影（blur 为 0），偏移用 em 跟字号走。
     不用 background-clip: text —— 裁不出字形时整行字会直接消失。 */
  h1 .solid {
    display: inline-block;
    text-shadow:
      0.022em 0.022em 0 color-mix(in srgb, var(--ink) 18%, transparent),
      0.044em 0.044em 0 color-mix(in srgb, var(--ink) 10%, transparent);
  }

  /* 照 endfield.css 的 .ef-wordmark .hollow：Saira 宽体、0.48 × 主字、间距 0.12em */
  h1 .hollow {
    display: block;
    margin-top: 0.12em;
    font-family: "Maintenance Wide", var(--sans);
    font-stretch: 125%;
    font-size: 0.48em;
    line-height: 0.84;
    letter-spacing: 0.02em;
    color: transparent;
    -webkit-text-stroke: 2px var(--ink);
  }

  .lede {
    position: relative;
    max-width: 26rem;
    margin: clamp(1.25rem, 3.5vh, 2rem) 0 0;
    font-size: clamp(15px, 1.6vw, 18px);
    line-height: 1.8;
    color: var(--ink-2);
  }

  .meta {
    position: relative;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem 1.25rem;
    margin: auto 0 0;
    padding-top: clamp(3rem, 12vh, 8rem);
    border-top: 1px solid var(--rule);
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.08em;
    font-variant-numeric: tabular-nums;
    color: var(--ink-2);
  }
  .meta b { color: var(--ink); font-weight: 600; }
  .meta .state {
    padding: 0.1em 0.55em;
    background: var(--signal);
    color: var(--ink);
    font-weight: 700;
  }

  /* 条形码：SVG 默认是 inline，高度会被行盒吃掉，必须 block */
  .code {
    display: block;
    margin-left: auto;
    width: min(34vw, 92px);
    height: 13px;
    color: var(--ink);
    opacity: 0.7;
  }

  @media (prefers-color-scheme: dark) {
    :root { --paper: #181818; --ink: #EDEDED; --ink-2: #9A9A96; --rule: #333333; }
  }
</style>

<script>
(function () {
  // 条形码：12 条，宽度按当天日期定
  var NS = "http://www.w3.org/2000/svg";
  var today = new Date().toISOString().slice(0, 10);   // 2026-10-30
  var widths = [], gaps = [];
  for (var i = 0; i < 12; i++) {
    widths.push((today.charCodeAt(i % today.length) * (i + 3)) % 4 + 1);
    gaps.push((today.charCodeAt((i + 4) % today.length) * (i + 5)) % 3 + 1);
  }
  var total = widths.reduce(function (a, b) { return a + b; }, 0)
            + gaps.slice(0, 11).reduce(function (a, b) { return a + b; }, 0);
  var unit = 120 / total;
  var x = 0;
  var bars = document.getElementById("bars");
  widths.forEach(function (w, i) {
    var r = document.createElementNS(NS, "rect");
    r.setAttribute("x", x.toFixed(2));
    r.setAttribute("y", "0");
    r.setAttribute("width", (w * unit).toFixed(2));
    r.setAttribute("height", "24");
    bars.appendChild(r);
    x += w * unit;
    if (i < 11) x += gaps[i] * unit;
  });

  // 时钟
  var el = document.getElementById("clock");
  var pad = function (n) { return String(n).padStart(2, "0"); };
  var tick = function () {
    var d = new Date();
    el.textContent = d.getFullYear() + "." + pad(d.getMonth() + 1) + "." + pad(d.getDate())
      + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  };
  tick();
  setInterval(tick, 30000);
})();
</script>
