<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<title>1GN4CI0 · 维护中</title>
<style>
  /* 维护时 public/ 被整体替换，站点字体不在，所以这份子集跟页面放在一起 */
  @font-face {
    font-family: "Maintenance Sans";
    src: url("./fonts/noto.woff2") format("woff2");
    font-weight: 100 900;
    font-display: swap;
  }
  /* 拉丁字标用 Saira 宽体，和 skill 的 .ef-wordmark 一致 */
  @font-face {
    font-family: "Maintenance Wide";
    src: url("./fonts/saira.woff2") format("woff2");
    font-weight: 100 900;
    font-stretch: 50% 125%;
    font-display: swap;
  }
  @font-face {
    font-family: "Maintenance Mono";
    src: url("./fonts/mono.woff2") format("woff2");
    font-weight: 400;
    font-display: swap;
  }

  :root {
    --paper: #F4F4F1;
    --ink: #161616;
    --ink-2: #5C5C58;
    --rule: #DCDCD7;
    --signal: #FFFA00;
    --magenta: #FF00F0;
    --mint: #00F0B4;
    --sans: "Maintenance Sans", -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    --mono: "Maintenance Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    grid-template-rows: 3px 1fr 3px;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  .tri { display: grid; grid-template-columns: repeat(3, 1fr); }
  .tri i:nth-child(1) { background: var(--magenta); }
  .tri i:nth-child(2) { background: var(--signal); }
  .tri i:nth-child(3) { background: var(--mint); }

  /* 等高线底纹：和站点同一套质感，纯 CSS */
  main {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: clamp(1.5rem, 6vw, 6rem);
    overflow: hidden;
  }
  /* 等高线地形（取自 endfield-ui 的 contour-a，marching squares 生成的真地形）：
     从右上角向外——近处实线 + 斜线阴影，远处虚线，整体渐淡。用三层各带方向遮罩实现。 */
  .terrain {
    position: absolute;
    top: 0;
    right: 0;
    width: min(96vmin, 900px);
    height: min(96vmin, 900px);
    color: var(--ink);
    pointer-events: none;
  }
  .terrain svg { display: block; width: 100%; height: 100%; }

  .eyebrow {
    position: relative;
    margin: 0 0 clamp(1.25rem, 3.5vh, 2.25rem);
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-2);
  }
  .eyebrow::before { content: "// "; opacity: 0.55; }

  h1 {
    position: relative;
    margin: 0;
    font-size: clamp(3rem, 10vw, 11rem);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.02em;
  }

  /* 伪 3D：两层硬边投影（blur 为 0），偏移用 em 跟字号走。
     不用 background-clip: text —— 裁不出字形时整行字会直接消失。 */
  h1 .solid {
    display: inline-block;
    text-shadow:
      0.022em 0.022em 0 color-mix(in srgb, var(--ink) 18%, transparent),
      0.044em 0.044em 0 color-mix(in srgb, var(--ink) 10%, transparent);
  }

  /* 照 endfield.css 的 .ef-wordmark .hollow：Saira 宽体、0.48 × 主字、间距 0.12em */
  h1 .hollow {
    display: block;
    margin-top: 0.12em;
    font-family: "Maintenance Wide", var(--sans);
    font-stretch: 125%;
    font-size: 0.48em;
    line-height: 0.84;
    letter-spacing: 0.02em;
    color: transparent;
    -webkit-text-stroke: 2px var(--ink);
  }


  .meta {
    position: relative;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem 1.25rem;
    margin: auto 0 0;
    padding-top: clamp(3rem, 12vh, 8rem);
    border-top: 1px solid var(--rule);
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.08em;
    font-variant-numeric: tabular-nums;
    color: var(--ink-2);
  }
  .meta b { color: var(--ink); font-weight: 600; }
  .meta .state {
    padding: 0.1em 0.55em;
    background: var(--signal);
    color: var(--ink);
    font-weight: 700;
  }

  /* 条形码：SVG 默认是 inline，高度会被行盒吃掉，必须 block */
  .code {
    display: block;
    margin-left: auto;
    width: min(34vw, 92px);
    height: 13px;
    color: var(--ink);
    opacity: 0.7;
  }

  /* 窄屏把地形放大：遮罩的可见区是相对半径，元素小了就只剩一小块 */
  @media (max-width: 600px) {
    .terrain { width: 135vmin; height: 135vmin; }
  }

  @media (prefers-color-scheme: dark) {
    :root { --paper: #181818; --ink: #EDEDED; --ink-2: #9A9A96; --rule: #333333; }
  }
</style>
</head>
<body>
  <div class="tri" aria-hidden="true"><i></i><i></i><i></i></div>

  <main>
    
    <div class="terrain" aria-hidden="true"><svg id="terrain" preserveAspectRatio="xMaxYMin slice"></svg></div>

    <p class="eyebrow">Maintenance</p>

    <h1>
      <span class="solid">暂时离线</span>
      <span class="hollow">OFFLINE</span>
    </h1>

    <p class="meta">
      <span>1GN4CI0</span>
      <span class="state">维护中</span>
      <span id="clock">----.--.-- --:--</span>
      <span id="tz">UTC±--</span>
      <svg class="code" viewBox="0 0 120 24" preserveAspectRatio="none" role="img" aria-label="编号条码">
        <g id="bars" fill="currentColor"></g>
      </svg>
    </p>
  </main>

  <div class="tri" aria-hidden="true"><i></i><i></i><i></i></div>

<script>
(function () {
  // 条形码：12 条，宽度按当天日期定
  var NS = "http://www.w3.org/2000/svg";
  var today = new Date().toISOString().slice(0, 10);   // 2026-10-30
  var widths = [], gaps = [];
  for (var i = 0; i < 12; i++) {
    widths.push((today.charCodeAt(i % today.length) * (i + 3)) % 4 + 1);
    gaps.push((today.charCodeAt((i + 4) % today.length) * (i + 5)) % 3 + 1);
  }
  var total = widths.reduce(function (a, b) { return a + b; }, 0)
            + gaps.slice(0, 11).reduce(function (a, b) { return a + b; }, 0);
  var unit = 120 / total;
  var x = 0;
  var bars = document.getElementById("bars");
  widths.forEach(function (w, i) {
    var r = document.createElementNS(NS, "rect");
    r.setAttribute("x", x.toFixed(2));
    r.setAttribute("y", "0");
    r.setAttribute("width", (w * unit).toFixed(2));
    r.setAttribute("height", "24");
    bars.appendChild(r);
    x += w * unit;
    if (i < 11) x += gaps[i] * unit;
  });


  // 时区：跟主站同一套判断，写成 UTC±N
  (function () {
    var tzEl = document.getElementById("tz");
    if (!tzEl) return;
    try {
      var off = -new Date().getTimezoneOffset() / 60;
      var sign = off >= 0 ? "+" : "\u2212";
      var abs = Math.abs(off);
      tzEl.textContent = "UTC" + sign + (Number.isInteger(abs) ? abs : abs.toFixed(1));
      tzEl.title = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
    } catch (e) { tzEl.textContent = ""; }
  })();

  // 时钟
  var el = document.getElementById("clock");
  var pad = function (n) { return String(n).padStart(2, "0"); };
  var tick = function () {
    var d = new Date();
    el.textContent = d.getFullYear() + "." + pad(d.getMonth() + 1) + "." + pad(d.getDate())
      + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  };
  tick();
  setInterval(tick, 30000);
})();

  /* ---------- 等高线：以当天日期为种子现场生成 ----------
     算法取自 endfield-ui 的 draw-contours.mjs（地形高度场 + marching squares），
     同一天得到同一片地形，换一天就是另一片。 */
  (function () {
    var CELL = 12, W = 900, H = 900, LEVELS = 22;

    function hash(str) {                       // FNV-1a
      var h = 2166136261;
      for (var i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return h >>> 0;
    }

    function rng(seed) {
      var a = seed >>> 0;
      return function () {
        a = (a + 0x6d2b79f5) >>> 0;
        var t = a;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function terrain(seed, w, h) {
      var r = rng(seed);
      var dir = r() * Math.PI;
      var cx = Math.cos(dir), cy = Math.sin(dir);
      var waves = [];
      for (var k = 0; k < 9; k++) {
        var f = 0.8 + k * 0.75 + r() * 0.5;
        var th = r() * Math.PI * 2;
        waves.push({ fx: (f * Math.cos(th)) / w, fy: (f * Math.sin(th)) / w, p: r() * 6.28, a: 0.11 / (1 + k * 0.8) });
      }
      return function (x, y) {
        var bx = x + 0.06 * w * Math.sin((6.28 * 1.3 * y) / h + 1.7);
        var by = y + 0.06 * h * Math.sin((6.28 * 0.9 * x) / w + 0.4);
        var v = (bx * cx + by * cy) / w;
        for (var i = 0; i < waves.length; i++) {
          var s = waves[i];
          v += s.a * Math.sin(6.28 * (s.fx * bx + s.fy * by) + s.p);
        }
        return v;
      };
    }

    function trace(field, nx, ny, level) {
      var at = function (i, j) { return field[j * (nx + 1) + i]; };
      var points = {}, links = {};
      var mix = function (a, b) { return (level - a) / (b - a); };
      var edge = function (kind, i, j) {
        var key = kind + i + ',' + j;
        if (!points[key]) {
          points[key] = kind === 'h'
            ? [(i + mix(at(i, j), at(i + 1, j))) * CELL, j * CELL]
            : [i * CELL, (j + mix(at(i, j), at(i, j + 1))) * CELL];
        }
        return key;
      };
      var join = function (a, b) {
        (links[a] = links[a] || []).push(b);
        (links[b] = links[b] || []).push(a);
      };
      var SIDES = { 1: ['LB'], 2: ['BR'], 3: ['LR'], 4: ['TR'], 5: ['TL', 'BR'], 6: ['TB'], 7: ['TL'], 8: ['TL'], 9: ['TB'], 10: ['TR', 'LB'], 11: ['TR'], 12: ['LR'], 13: ['BR'], 14: ['LB'] };
      for (var j = 0; j < ny; j++) {
        for (var i = 0; i < nx; i++) {
          var c = (at(i, j) > level ? 8 : 0) | (at(i + 1, j) > level ? 4 : 0)
                | (at(i + 1, j + 1) > level ? 2 : 0) | (at(i, j + 1) > level ? 1 : 0);
          var side = {
            T: function () { return edge('h', i, j); },
            B: function () { return edge('h', i, j + 1); },
            L: function () { return edge('v', i, j); },
            R: function () { return edge('v', i + 1, j); }
          };
          var pairs = SIDES[c] || [];
          for (var q = 0; q < pairs.length; q++) join(side[pairs[q][0]](), side[pairs[q][1]]());
        }
      }

      var seen = {};
      var walk = function (start) {
        var line = [start];
        seen[start] = 1;
        var here = start;
        for (;;) {
          var to = links[here] || [];
          var next = null;
          for (var z = 0; z < to.length; z++) if (!seen[to[z]]) { next = to[z]; break; }
          if (!next) break;
          seen[next] = 1;
          line.push(next);
          here = next;
        }
        return line;
      };
      var out = [];
      for (var key in links) if (links[key].length === 1 && !seen[key]) out.push({ keys: walk(key), closed: false });
      for (var key2 in links) if (!seen[key2]) out.push({ keys: walk(key2), closed: true });
      return out.map(function (l) {
        return { closed: l.closed, pts: l.keys.map(function (k) { return points[k]; }) };
      });
    }

    var num = function (v) { return Math.round(v * 10) / 10; };

    function toPath(line) {
      var pts = line.pts;
      if (line.closed || pts.length < 24) return '';
      var d = 'M' + num(pts[0][0]) + ' ' + num(pts[0][1]);
      for (var k = 1; k < pts.length - 1; k++) {
        var mx = (pts[k][0] + pts[k + 1][0]) / 2;
        var my = (pts[k][1] + pts[k + 1][1]) / 2;
        d += 'Q' + num(pts[k][0]) + ' ' + num(pts[k][1]) + ' ' + num(mx) + ' ' + num(my);
      }
      var last = pts[pts.length - 1];
      return d + 'L' + num(last[0]) + ' ' + num(last[1]);
    }

    function draw() {
      var svg = document.getElementById('terrain');
      if (!svg) return;
      // 用本地日期，不用 toISOString —— 那个是 UTC，东八区凌晨会算成前一天
      var nd = new Date();
      var today = nd.getFullYear() + '-'
        + String(nd.getMonth() + 1).padStart(2, '0') + '-'
        + String(nd.getDate()).padStart(2, '0');
      var seed = hash(today);

      svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);

      var nx = Math.round(W / CELL), ny = Math.round(H / CELL);
      var f = terrain(seed, W, H);
      var field = new Float32Array((nx + 1) * (ny + 1));
      var top = -Infinity, bottom = Infinity;
      for (var j = 0; j <= ny; j++) {
        for (var i = 0; i <= nx; i++) {
          var v = f(i * CELL, j * CELL);
          field[j * (nx + 1) + i] = v;
          if (v > top) top = v;
          if (v < bottom) bottom = v;
        }
      }

      var thin = '', index = '';
      for (var k = 1; k <= LEVELS; k++) {
        var level = bottom + ((top - bottom) * k) / (LEVELS + 1);
        var lines = trace(field, nx, ny, level);
        var d = '';
        for (var q = 0; q < lines.length; q++) d += toPath(lines[q]);
        if (k % 5 === 0) index += d; else thin += d;
      }

      svg.innerHTML =
        '<defs>' +
          '<radialGradient id="tn" gradientUnits="userSpaceOnUse" cx="' + W + '" cy="0" r="' + W + '">' +
            '<stop offset="0" stop-color="#fff"/>' +
            '<stop offset="0.32" stop-color="#fff" stop-opacity="0.9"/>' +
            '<stop offset="0.58" stop-color="#fff" stop-opacity="0.28"/>' +
            '<stop offset="0.86" stop-color="#fff" stop-opacity="0"/>' +
          '</radialGradient>' +
          '<linearGradient id="ts" gradientUnits="userSpaceOnUse" x1="' + W + '" y1="0" x2="0" y2="' + H + '">' +
            '<stop offset="0" stop-color="#000" stop-opacity="0"/>' +
            '<stop offset="0.42" stop-color="#000" stop-opacity="0.85"/>' +
            '<stop offset="0.72" stop-color="#000" stop-opacity="1"/>' +
            '<stop offset="1" stop-color="#000" stop-opacity="0.2"/>' +
          '</linearGradient>' +
          '<mask id="mn"><rect width="' + W + '" height="' + H + '" fill="url(#tn)"/></mask>' +
          '<mask id="ms"><rect width="' + W + '" height="' + H + '" fill="url(#ts)"/></mask>' +
        '</defs>' +
        // 近处：实线，深
        '<g mask="url(#mn)" stroke="currentColor" fill="none">' +
          '<path stroke-width="1.1" opacity="0.9" d="' + thin + '"/>' +
          '<path stroke-width="1.9" opacity="1" d="' + index + '"/>' +
        '</g>' +
        // 远处：虚线，更淡
        '<g mask="url(#ms)" stroke="currentColor" fill="none">' +
          '<path stroke-width="1" stroke-dasharray="5 6" opacity="0.42" d="' + thin + '"/>' +
          '<path stroke-width="1.6" stroke-dasharray="6 8" opacity="0.5" d="' + index + '"/>' +
        '</g>';
    }

    draw();
  })();
</script>
</body>
</html>
