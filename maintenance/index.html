<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>1GN4CI0 · 维护中</title>
<style>
  :root {
    --paper: #F4F4F1;
    --ink: #161616;
    --ink-2: #5C5C58;
    --rule: #DCDCD7;
    --signal: #FFFA00;
    --magenta: #FF00F0;
    --mint: #00F0B4;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    grid-template-rows: auto 1fr auto;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .tri { display: grid; grid-template-columns: repeat(3, 1fr); height: 3px; }
  .tri i:nth-child(1) { background: var(--magenta); }
  .tri i:nth-child(2) { background: var(--signal); }
  .tri i:nth-child(3) { background: var(--mint); }

  /* 等高线底纹：和站点同一套质感，纯 CSS，不依赖外部文件 */
  main {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: clamp(1.5rem, 6vw, 6rem);
    overflow: hidden;
  }
  main::before {
    content: "";
    position: absolute;
    inset: -20% -10% auto auto;
    width: 70vmin;
    height: 70vmin;
    background-image: repeating-radial-gradient(
      circle at 60% 40%,
      transparent 0 38px,
      rgba(22, 22, 22, 0.055) 38px 39px
    );
    pointer-events: none;
  }

  .eyebrow {
    margin: 0 0 1.5rem;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-2);
  }
  .eyebrow::before { content: "// "; opacity: 0.55; }

  h1 {
    margin: 0;
    font-size: clamp(44px, 11vw, 132px);
    font-weight: 800;
    line-height: 0.98;
    letter-spacing: -0.02em;
  }
  h1 .hollow {
    display: block;
    margin-top: 0.06em;
    color: transparent;
    -webkit-text-stroke: 2px var(--ink);
  }

  .lede {
    max-width: 26rem;
    margin: 2rem 0 0;
    font-size: clamp(15px, 1.6vw, 18px);
    line-height: 1.8;
    color: var(--ink-2);
  }

  .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem 1.25rem;
    margin: auto 0 0;
    padding-top: clamp(3rem, 12vh, 8rem);
    border-top: 1px solid var(--rule);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    font-variant-numeric: tabular-nums;
    color: var(--ink-2);
  }
  .meta b { color: var(--ink); font-weight: 600; }

  @media (prefers-color-scheme: dark) {
    :root { --paper: #181818; --ink: #EDEDED; --ink-2: #9A9A96; --rule: #333333; }
    main::before { background-image: repeating-radial-gradient(circle at 60% 40%, transparent 0 38px, rgba(237, 237, 237, 0.05) 38px 39px); }
  }
</style>
</head>
<body>
  <div class="tri" aria-hidden="true"><i></i><i></i><i></i></div>

  <main>
    <p class="eyebrow">Maintenance</p>
    <h1>暂时离线<span class="hollow">OFFLINE</span></h1>
    <p class="lede">站点正在调整，稍后回来。文章和订阅源都还在，恢复后照常访问。</p>
    <p class="meta">
      <span>1GN4CI0</span>
      <span>状态 <b>维护中</b></span>
      <span id="clock">----.--.-- --:--</span>
    </p>
  </main>

  <div class="tri" aria-hidden="true"><i></i><i></i><i></i></div>

<script>
  (function () {
    var el = document.getElementById('clock');
    var pad = function (n) { return String(n).padStart(2, '0'); };
    var tick = function () {
      var d = new Date();
      el.textContent = d.getFullYear() + '.' + pad(d.getMonth() + 1) + '.' + pad(d.getDate())
        + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    };
    tick();
    setInterval(tick, 30000);
  })();
</script>
</body>
</html>
