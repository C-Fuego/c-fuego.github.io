name: Deploy Hugo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.168.0"
          extended: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        run: |
          hugo --minify --gc \
            --baseURL "${{ steps.pages.outputs.base_url }}/" \
            --destination ./public

      # 仓库根有 MAINTENANCE 文件时，用维护页整体替换站点产物。
      # 恢复：删掉这个文件并 push，下一次构建就是完整站点。
      - name: Maintenance override
        if: hashFiles('MAINTENANCE') != ''
        run: |
          echo "MAINTENANCE present — replacing site with maintenance page"
          rm -rf public
          mkdir -p public
          cp -r maintenance/. public/
          cp public/index.html public/404.html
          ls -la public

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
