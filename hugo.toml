baseURL = "https://c-fuego.github.io/"
locale = "zh-CN"
defaultContentLanguage = "zh-cn"
title = "C-FUEGO"
hasCJKLanguage = true
enableRobotsTXT = true
disableHugoGeneratorInject = true
timeZone = "Asia/Shanghai"

[params]
  author = "1GN4CI0"
  description = "技术笔记、图集、一句话碎念，混在一个日志里。"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = true
    style = "monokai"
    lineNos = false

[outputs]
  home = ["HTML", "RSS"]

[pagination]
  pagerSize = 50

[menu]
  [[menu.main]]
    name = "INDEX"
    pageRef = "/"
    weight = 10
  [[menu.main]]
    name = "LOG"
    pageRef = "/posts"
    weight = 20
  [[menu.main]]
    name = "ABOUT"
    url = "/#about"
    weight = 30

[taxonomies]
  tag = "tags"
