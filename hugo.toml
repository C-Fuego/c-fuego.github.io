baseURL = "https://www.ignacio.dpdns.org/"
locale = "zh-CN"
defaultContentLanguage = "zh-cn"
title = "IGNACIO"
hasCJKLanguage = true
enableRobotsTXT = true
timeZone = "Asia/Shanghai"

[params]
  worldName = "0x00"
  worldTagline = "由 0 与 1 构成的档案层"
  author = "ignacio"
  description = "数值世界的个人档案：0 与 1 构成的记述层。"
  # 首页统计面板里的“最后同步”由构建时间生成

[params.ui]
  showToc = true
  tocDepth = 3

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    style = "github"
    lineNos = false

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]

[pagination]
  pagerSize = 12

[menu]
  [[menu.main]]
    name = "归档"
    pageRef = "/posts"
    weight = 10
  [[menu.main]]
    name = "关于"
    pageRef = "/about"
    weight = 20
  [[menu.main]]
    name = "标签"
    pageRef = "/tags"
    weight = 30

[minify]
  minifyOutput = false

[taxonomies]
  tag = "tags"
